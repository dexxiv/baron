<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">

 <meta name="description" content="Baron — an international property trading game. Create a room, invite friends, and build your empire. No accounts needed.">
 <title>Baron · The world is your board</title>
 <link rel="icon" href="./favicon.svg" type="image/svg+xml">

<body>
 <header class="site-header">
